{% extends 'base.html' %} <!-- Changed to base.html to ensure glassmorphism logic carries over -->
{% load static %}

{% block content %}
<div class="max-w-md mx-auto py-10">
  <div class="glassmorphism rounded-3xl p-10 flex flex-col items-center shadow-2xl">
    
<!-- Mersa Branding -->
    <div class="mb-8 text-center">
        <!-- Logo Image -->
        <img src="{% static 'images/mersa-logo.png' %}" alt="Mersa Logo" class="h-20 w-auto mx-auto mb-4 drop-shadow-2xl">
        
        <h2 class="text-2xl font-black text-white">Create Account</h2>
        <p class="text-gray-400 text-sm mt-1">Join the Mersa Task Management System</p>
    </div>

    <form class="w-full flex flex-col gap-4" method="post">
      {% csrf_token %}
      
      {% for field in form %}
      <div class="flex flex-col gap-1">
        <label class="text-[10px] font-black text-gray-500 uppercase tracking-widest ml-1">{{ field.label }}</label>
        <div class="relative">
            {{ field }}
            <!-- Note: We inject Tailwind styling via the style block in base.html 
                 or by adding classes to the form fields in forms.py -->
        </div>
        {% if field.errors %}
            <small class="text-red-400 text-[10px] bg-red-500/10 p-2 rounded mt-1">{{ field.errors.0 }}</small>
        {% endif %}
      </div>
      {% endfor %}

      <button type="submit" class="w-full mt-4 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold transition-all shadow-xl shadow-indigo-500/20 uppercase tracking-widest text-sm">
        Sign Up
      </button>

      <div class="text-center mt-6">
        <p class="text-gray-400 text-xs">
          Already have an account? 
          <a href="{% url 'login' %}" class="text-indigo-400 font-bold hover:text-white transition-colors underline underline-offset-4">Login</a>
        </p>
      </div>
    </form>
  </div>
</div>

<style>
    /* Targeting the auto-generated Django inputs */
    input {
        width: 100%;
        background: rgba(255, 255, 255, 0.05) !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        color: white !important;
        border-radius: 0.75rem !important;
        padding: 0.75rem 1rem !important;
        font-size: 0.875rem !important;
    }
    input:focus {
        outline: none !important;
        border-color: #6366f1 !important;
        background: rgba(255, 255, 255, 0.1) !important;
    }
</style>
{% endblock content %}
