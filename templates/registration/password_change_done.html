{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="max-w-md mx-auto py-10">
  <div class="glassmorphism rounded-3xl p-10 flex flex-col items-center shadow-2xl">
    <div class="mb-8 text-center">
        <img src="{% static 'images/mersa-logo.png' %}" alt="Mersa Logo" class="h-20 w-auto mx-auto mb-4 drop-shadow-2xl">
        <h2 class="text-2xl font-black text-white">Password Changed</h2>
        <p class="text-gray-400 text-sm mt-1">Your password was updated successfully.</p>
    </div>

    <div class="w-full">
      <a href="{% url 'login' %}" class="w-full block text-center py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold transition-all shadow-xl shadow-indigo-500/20 uppercase tracking-widest text-sm">
        Sign In
      </a>
    </div>
  </div>
</div>
{% endblock content %}
