{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto py-12">
  
  <div class="glassmorphism rounded-3xl overflow-hidden border-t-4 border-red-500/50">
    <div class="p-8 md:p-12 flex flex-col items-center text-center">
      
      <div class="h-20 w-20 rounded-full bg-red-500/10 flex items-center justify-center text-red-500 mb-6">
        <span class="material-symbols-outlined text-5xl">category</span>
      </div>

      <h2 class="text-3xl font-black text-white mb-4">Delete Task Type?</h2>
      <p class="text-gray-400 text-lg mb-8 leading-relaxed">
        Are you sure you want to remove the category: <br>
        <span class="text-white font-bold">"{{ object }}"</span>? <br>
        <span class="text-red-400/80 text-sm font-medium mt-2 block">This may affect how tasks are filtered in the system.</span>
      </p>

      <form action="" method="post" class="flex flex-col sm:flex-row items-center gap-4 w-full justify-center">
        {% csrf_token %}
        <button type="submit" class="w-full sm:w-auto px-10 py-3 bg-red-600 hover:bg-red-500 text-white rounded-xl font-bold transition-all shadow-xl shadow-red-900/20">
          Yes, Delete Type
        </button>
        <a href="{% url 'task_manager:task_type-list' %}" class="w-full sm:w-auto px-10 py-3 glassmorphism hover:bg-white/10 text-gray-300 rounded-xl font-bold transition-all text-center">
          Cancel
        </a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
