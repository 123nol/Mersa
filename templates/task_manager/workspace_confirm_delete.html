{% extends "base.html" %}
{% block content %}
  <h2>Delete Workspace: {{ workspace.name }}</h2>
  <p>Are you sure you want to delete this workspace? This action cannot be undone.</p>
  <form method="post">{% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'task_manager:workspace-detail' workspace.id %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
