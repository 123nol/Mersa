{% extends 'base.html' %}

{% block content %}
<div class="max-w-3xl mx-auto py-10">
  <div class="glassmorphism rounded-3xl p-8">
    <h2 class="text-2xl font-black text-white mb-2">Profile</h2>
    <p class="text-gray-400 mb-4">Basic account information</p>
    <div class="grid grid-cols-1 gap-3">
      <div class="p-4 bg-white/5 rounded-lg">
        <p class="text-[10px] text-gray-400 uppercase font-black">Name</p>
        <p class="text-white">{{ user_obj.first_name }} {{ user_obj.last_name }}</p>
      </div>
      <div class="p-4 bg-white/5 rounded-lg">
        <p class="text-[10px] text-gray-400 uppercase font-black">Email</p>
        <p class="text-white">{{ user_obj.email }}</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
