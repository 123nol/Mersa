{% extends "base.html" %}

{% block content %}
<div class="max-w-xl mx-auto flex flex-col gap-6">
  
  <!-- Header -->
  <div class="flex items-center gap-4 border-b border-white/10 pb-6">
    <div class="h-12 w-12 rounded-xl bg-purple-500/20 flex items-center justify-center text-purple-400">
      <span class="material-symbols-outlined text-3xl">manage_accounts</span>
    </div>
    <div>
      <h2 class="text-2xl font-bold text-white">Change Permissions</h2>
      <p class="text-sm text-gray-400">Updating role for <span class="text-purple-400 font-bold">{{ member.user.username }}</span></p>
    </div>
  </div>

  <!-- Form Card -->
  <div class="glassmorphism p-8 rounded-2xl relative overflow-hidden">
    <div class="absolute -top-12 -right-12 h-32 w-32 bg-purple-500/10 rounded-full blur-2xl"></div>

    <form method="post" class="relative z-10 flex flex-col gap-6">
      {% csrf_token %}
      
      <div class="flex flex-col gap-2">
        <label for="role" class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">New Role Assignment</label>
        <select name="role" id="role" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500 transition-all appearance-none cursor-pointer">
          <option value="ADMIN" class="bg-[#1a237e] text-white" {% if member.role == 'ADMIN' %}selected{% endif %}>Admin (Full Access)</option>
          <option value="MANAGER" class="bg-[#1a237e] text-white" {% if member.role == 'MANAGER' %}selected{% endif %}>Manager (Team Control)</option>
          <option value="MEMBER" class="bg-[#1a237e] text-white" {% if member.role == 'MEMBER' %}selected{% endif %}>Member (Standard)</option>
          <option value="VIEWER" class="bg-[#1a237e] text-white" {% if member.role == 'VIEWER' %}selected{% endif %}>Viewer (Read Only)</option>
        </select>
      </div>

      <div class="flex flex-col gap-3 mt-4 pt-6 border-t border-white/10">
        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold transition-all shadow-lg shadow-indigo-500/20">
          Update Role
        </button>
        <a href="{% url 'task_manager:workspace-detail' workspace.id %}" class="w-full py-3 text-center text-gray-500 hover:text-white transition-colors text-sm font-bold">
          Back to Workspace
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
